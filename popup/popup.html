<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temporal Lens</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #101217;
        color: #f4f6fb;
      }

      main {
        padding: 16px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }

      p {
        margin: 0 0 16px;
        color: #c6ccdb;
        font-size: 0.875rem;
      }

      form {
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        gap: 6px;
      }

      .inline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .checkboxes {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.875rem;
        color: #e9edf8;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #2d3343;
        background: #161b25;
        color: inherit;
        box-sizing: border-box;
      }

      input[type="range"] {
        width: 100%;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        background: #5865f2;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }

      #status {
        min-height: 18px;
        margin-top: 8px;
        color: #c6ccdb;
        font-size: 0.8rem;
      }

      .muted {
        color: #9aa4bd;
        font-size: 0.78rem;
      }

      .tl-storage-note {
        margin: -8px 0 0;
        color: #9aa4bd;
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Temporal Lens</h1>
      <p>Inline timestamp annotation for websites.</p>
      <form id="settings-form">
        <label class="inline" for="enabled">
          <span>Extension enabled</span>
          <input id="enabled" name="enabled" type="checkbox" />
        </label>

        <p class="tl-storage-note">All temporal analysis happens locally in your browser. No API key, no telemetry, and no message text leaves your computer.</p>

        <div class="row">
          <label for="confidence-threshold">Confidence threshold: <output id="threshold-value">0.85</output></label>
          <input id="confidence-threshold" name="confidenceThreshold" type="range" min="0.7" max="0.99" step="0.01" />
          <span class="muted">Higher values show only stronger, more explicit time references.</span>
        </div>

        <label class="inline" for="show-medium-confidence">
          <span>Show medium-confidence chips</span>
          <input id="show-medium-confidence" name="showMediumConfidence" type="checkbox" />
        </label>

        <div class="row">
          <span>Platforms</span>
          <div class="checkboxes">
            <label class="inline" for="platform-discord">
              <span>Discord</span>
              <input id="platform-discord" name="platformDiscord" type="checkbox" />
            </label>
            <label class="inline" for="platform-slack">
              <span>Slack</span>
              <input id="platform-slack" name="platformSlack" type="checkbox" />
            </label>
            <label class="inline" for="platform-web">
              <span>Websites</span>
              <input id="platform-web" name="platformWeb" type="checkbox" />
            </label>
          </div>
        </div>

        <div class="row">
          <label for="chip-color">Chip accent color</label>
          <input id="chip-color" name="chipColor" type="color" />
        </div>

        <button type="submit">Save Settings</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
